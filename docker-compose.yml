services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: aerovhyn_backend
    environment:
      - USE_SQLITE=true
      - AEROVHYN_DB_PATH=aerovhyn.db
      - AEROVHYN_JWT_SECRET=8a7d8a7d8a7d8a7d8a7d8a7d8a7d8a7d8a7d8a7d8a7d8a7d8a7d8a7d8a7d8a7d
      - CORS_ORIGINS=http://localhost:5173,http://localhost:5174
    ports:
      - "8000:8000"
    restart: unless-stopped
    networks:
      - app-network

  admin:
    build:
      context: ./admin
      dockerfile: Dockerfile
    container_name: aerovhyn_admin
    environment:
      - VITE_BACKEND_URL=http://backend:8000
      - VITE_BACKEND_WS_URL=ws://backend:8000
    ports:
      - "5173:5173"
    depends_on:
      - backend
    networks:
      - app-network

  hospital:
    build:
      context: ./hospital
      dockerfile: Dockerfile
    container_name: aerovhyn_hospital
    environment:
      - VITE_BACKEND_URL=http://backend:8000
      - VITE_BACKEND_WS_URL=ws://backend:8000
    ports:
      - "5174:5174"
    depends_on:
      - backend
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
