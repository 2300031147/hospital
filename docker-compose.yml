services:
  postgres:
    image: postgres:16-alpine
    container_name: aerovhyn_postgres
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=aerovhyn
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - app-network

  redis:
    image: redis:7-alpine
    container_name: aerovhyn_redis
    ports:
      - "6379:6379"
    restart: unless-stopped
    networks:
      - app-network

  backend:
    build:
      context: ./javabackend
      dockerfile: Dockerfile
    container_name: aerovhyn_backend
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/aerovhyn
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=postgres
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - AEROVHYN_JWT_SECRET=8a7d8a7d8a7d8a7d8a7d8a7d8a7d8a7d8a7d8a7d8a7d8a7d8a7d8a7d8a7d8a7d
      - CORS_ORIGINS=http://localhost:5173,http://localhost:5174
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - redis
    restart: unless-stopped
    networks:
      - app-network

  admin:
    build:
      context: ./admin
      dockerfile: Dockerfile
    container_name: aerovhyn_admin
    environment:
      - VITE_BACKEND_URL=http://backend:8000
      - VITE_BACKEND_WS_URL=ws://backend:8000
    ports:
      - "5173:5173"
    depends_on:
      - backend
    networks:
      - app-network

  hospital:
    build:
      context: ./hospital
      dockerfile: Dockerfile
    container_name: aerovhyn_hospital
    environment:
      - VITE_BACKEND_URL=http://backend:8000
      - VITE_BACKEND_WS_URL=ws://backend:8000
    ports:
      - "5174:5174"
    depends_on:
      - backend
    networks:
      - app-network

volumes:
  pgdata:

networks:
  app-network:
    driver: bridge
